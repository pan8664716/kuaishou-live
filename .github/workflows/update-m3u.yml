name: 更新快手直播 m3u

on:
  # 每小时运行一次（cron 为 UTC，即北京时间每个整点）
  schedule:
    - cron: '0 * * * *'
  # 支持手动触发
  workflow_dispatch:

# 允许把更新后的 m3u 提交回仓库
permissions:
  contents: write

concurrency:
  group: update-m3u
  cancel-in-progress: false

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成 m3u（纯 HTTP，无需浏览器/签名）
        run: python3 update_m3u.py

      - name: 提交并推送更新
        run: |
          if git diff --quiet -- kuaishou_live.m3u; then
            echo "本轮没有新增/变化的房间，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add kuaishou_live.m3u
            git commit -m "chore: 更新 kuaishou_live.m3u（$(date -u +'%Y-%m-%d %H:%M UTC')）"
            git push
          fi
